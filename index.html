<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Window Dungeon — Launcher Control Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="launcher-container">
    <header class="launcher-header">
      <h1 class="launcher-title">🏰 Window Dungeon</h1>
      <p class="launcher-subtitle">Multi-Window Spatial Dungeon Crawler</p>
    </header>

    <!-- 게임 시작 화면 -->
    <div id="start-screen">
      <div class="start-card">
        <h2 style="margin: 0 0 12px 0; font-size: 22px;">새 던전 세션 시작</h2>
        <p>각 브라우저 창이 던전의 방이 됩니다.<br>팝업 창 허용 및 화면 정보(Window Management) 권한이 필요합니다.</p>
        <button id="btn-start" class="btn-primary">
          <span>⚔️ 게임 시작</span>
        </button>
      </div>
    </div>

    <!-- 실행 중 대시보드 화면 -->
    <div id="status" style="display: none;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="status-pill">
            <span class="pulse-dot"></span>
            <span>Master Server Running (30Hz)</span>
          </div>
          <span style="color: var(--accent-red); font-size: 13.5px; font-weight: 500;">
            ⚠️ 이 창을 닫으면 게임 세션이 종료됩니다.
          </span>
        </div>
        <button id="btn-reset" class="btn-reset" style="display: none; margin: 0;">
          <span>🔄 메인으로 돌아가기</span>
        </button>
      </div>

      <div class="dashboard-grid">
        <!-- 왼쪽: 미니맵 및 지표 -->
        <div class="dashboard-card">
          <div class="card-header">
            <h3 class="card-title">🗺️ 공간 미니맵</h3>
            <div style="display: flex; align-items: center; gap: 8px;">
              <button id="btn-pip" class="btn-pip" title="항상 위에 표시되는 플로팅 미니맵 띄우기">
                📌 Always-on-Top (PiP)
              </button>
              <span style="font-size: 12px; color: var(--text-muted); font-family: monospace;">Monitor Grid</span>
            </div>
          </div>
          <div id="minimap-container">
            <canvas id="minimap-canvas" width="600" height="400"></canvas>
          </div>
          <div id="sync-metrics">
            동기화 지표 대기 중...
          </div>
        </div>

        <!-- 오른쪽: 시스템 인스펙터 -->
        <div class="dashboard-card">
          <div class="card-header">
            <h3 class="card-title">🛠️ 시스템 인스펙터</h3>
            <span style="font-size: 12px; color: var(--text-muted); font-family: monospace;">BroadcastChannel (dungeon-v1)</span>
          </div>
          <div id="inspector-log">
            <!-- 실시간 로그가 여기에 추가됩니다 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/launcher.js"></script>
</body>
</html>
