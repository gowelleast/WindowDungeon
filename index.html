<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Window Dungeon - Launcher</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #1a1a1a; color: #eee; font-family: sans-serif; text-align: center; }
    #start-screen { margin-top: 150px; }
  </style>
</head>
<body>
  <h1>Window Dungeon</h1>

  <div id="start-screen">
    <p>팝업 창과 화면 정보(Window Management) 권한이 필요합니다.</p>
    <button id="btn-start" style="font-size: 20px; padding: 15px 30px;">게임 시작</button>
  </div>

  <div id="status" style="display:none; margin: 20px;">
    <h2>게임 서버 실행 중 🟢</h2>
    <p style="color: #ff5252; font-size: 14px;">[주의] 이 창을 닫으면 게임 서버가 완전히 종료됩니다.</p>
    
    <button id="btn-reset" style="display: none; font-size: 18px; padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px auto;">메인으로 돌아가기</button>
    
    <div style="display: flex; gap: 20px; justify-content: center; text-align: left; max-width: 1200px; margin: 0 auto; margin-top: 30px;">
      <!-- 왼쪽: 미니맵 및 지표 -->
      <div style="flex: 1; background: #2a2a2a; padding: 20px; border-radius: 8px;">
        <h3>🗺️ 미니맵 (실제 모니터 배치)</h3>
        <canvas id="minimap-canvas" width="600" height="400" style="background: #111; border: 1px solid #444; width: 100%;"></canvas>
        <div id="sync-metrics" style="margin-top: 15px; font-family: monospace; font-size: 14px; color: #4ade80;">
          Waiting for sync metrics...
        </div>
      </div>

      <!-- 오른쪽: 인스펙터 (로그) -->
      <div style="flex: 1; background: #2a2a2a; padding: 20px; border-radius: 8px; display: flex; flex-direction: column;">
        <h3>🛠️ 시스템 인스펙터</h3>
        <div id="inspector-log" style="flex: 1; min-height: 400px; max-height: 500px; overflow-y: auto; background: #111; border: 1px solid #444; padding: 10px; font-family: monospace; font-size: 13px; color: #ccc;">
          <!-- 로그가 여기에 추가됩니다 -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/launcher.js"></script>
</body>
</html>
